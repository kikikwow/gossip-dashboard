name: content-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Content rules (CONTENT_RULES.md)
        run: python3 src/check_content.py
      - name: Built page keeps new design
        run: |
          grep -q 吃瓜报 index.html
          grep -q board_ui index.html
          grep -q x_cache index.html
